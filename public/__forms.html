<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NUEVINCENT - Form Discovery</title>
</head>
<body>
  <!-- 
    ==============================================================================
    NETLIFY FORM DISCOVERY TEMPLATE
    ==============================================================================
    This static HTML form allows Netlify's post-processing build bot to detect 
    and configure the 'nuevincent-enquiry' form in the Netlify Dashboard 
    (Site > Forms > Submissions) even when rendered via Next.js client components.
  -->
  <form
    name="nuevincent-enquiry"
    data-netlify="true"
    netlify-honeypot="bot-field"
    action="/"
    method="POST"
    hidden
  >
    <input type="hidden" name="form-name" value="nuevincent-enquiry" />
    <input type="hidden" name="bot-field" />
    <input type="text" name="fullName" />
    <input type="text" name="company" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="text" name="projectType" />
    <input type="text" name="location" />
    <textarea name="description"></textarea>
    <input type="text" name="budgetRange" />
    <input type="text" name="timeline" />
    <input type="url" name="inspirationLink" />
    <input type="text" name="source" />
  </form>
</body>
</html>
